<button class="sb-action-btn model-hub-btn" id="modelHubBtn" title="Model Hub">

  <span class="sb-btn-text">Model Hub</span>
</button>

<div id="mhOverlay" class="mh-overlay">

    <div class="mh-titlebar">
      <div class="mh-titlebar-left">
        <svg class="mh-titlebar-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span class="mh-titlebar-text">Model Hub</span>
      </div>
      <div class="mh-win-controls">
        <button class="mh-win-btn" id="mhMaxBtn" title="Maximize">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="1" width="8" height="8" rx="1"/></svg>
        </button>
        <button class="mh-win-btn mh-close" id="mhCloseBtn" title="Close">

        </button>
      </div>
    </div>

    <div class="mh-tabs-bar">
      <button class="mh-tab active" data-tab="keys">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5"/><path d="M11.5 11.5L19 19"/><path d="M15 15l3-3"/><path d="M17 17l2-2"/></svg>

      <button class="mh-tab" data-tab="local">

      <button class="mh-tab" data-tab="active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l7.5 4.3v5.4c0 5.5-3.2 10.2-7.5 11.8-4.3-1.6-7.5-6.3-7.5-11.8V6.8L12 2.5z"/><polyline points="9 12.5 11 14.5 15.5 10" stroke-width="2.2"/></svg>
