<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asuum Universe - AI Workspace</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      .black-splash { position: fixed; inset: 0; z-index: 99999; background: #000; display: flex; align-items: center; justify-content: center; transition: opacity 0.4s ease, visibility 0.4s ease; }
      .splash-brand { font-family: 'Inter', sans-serif; font-size: 2.5rem; font-weight: 800; color: #fff; letter-spacing: -0.5px; opacity: 0; animation: splashFadeIn 0.6s ease forwards; }
      @keyframes splashFadeIn { to { opacity: 1; } }
      #app-root { opacity: 0; transition: opacity 0.4s ease; }
      body:not(.app-ready) .cr-overlay, body:not(.app-ready) .mh-overlay { visibility: hidden !important; opacity: 0 !important; }
      body.app-ready .black-splash { opacity: 0; visibility: hidden; pointer-events: none; }
      body.app-ready #app-root { opacity: 1; }
      .regen-btn.spinning svg { animation: regenSpin 0.8s linear infinite; }
      @keyframes regenSpin { to { transform: rotate(360deg); } }

      /* 🔒 GLOBAL LAYER GAP — Thin elegant border only */
      html body div#app-root {
        padding: 4px !important;
        gap: 4px !important;
      }
      @media (max-width: 768px) {
        html body div#app-root { padding: 3px !important; gap: 3px !important; }
      }
      @media (max-width: 480px) {
        html body div#app-root { padding: 2px !important; gap: 2px !important; }
      }
    </style>
</head>
<body>
    <div class="black-splash" id="blackSplash"><div class="splash-brand">Asuum</div></div>

    <div id="app-root">
      <aside class="sidebar" id="sidebar">
        <div class="sb-top">
          <div class="sb-brand"><span class="sb-logo-text">Asuum</span></div>
          <button class="sb-toggle-btn" id="sidebarToggle" title="Toggle Sidebar">
            <svg class="icon-expand" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 4v16"/><g class="arrow-move"><path d="M12 12h6.5"/><path d="M16 9.5 18.5 12 16 14.5"/></g></svg>
            <svg class="icon-collapse" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 7a3 3 0 0 1 3-3h3.5v16H6a3 3 0 0 1-3-3z" fill="currentColor" opacity="0.12" stroke="none"/><path d="M9.5 4v16"/><g class="arrow-move"><path d="M19 12h-6.5"/><path d="M15 9.5 12.5 12 15 14.5"/></g></svg>
          </button>
        </div>
        <div class="sb-middle">
          <button class="sb-action-btn new-chat-btn" title="New Chat">
            <svg class="sb-icon-new" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/><line x1="12" y1="8.5" x2="12" y2="14.5"/><line x1="9" y1="11.5" x2="15" y2="11.5"/></svg>
            <span class="sb-btn-text">New Chat</span>
          </button>
          <div class="sb-divider"></div>
          <button class="sb-action-btn model-hub-btn" id="modelHubBtn" title="Model Hub">
            <svg class="sb-icon-hub" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></svg>
            <span class="sb-btn-text">Model Hub</span>
          </button>
          <div class="sb-divider sb-divider-spaced"></div>
          <div class="sidebar-content"></div>
        </div>
        <div class="sb-bottom">
          <div class="sb-profile-box">
            <div class="sb-avatar" title="Profile">
              <svg class="sb-icon-profile" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
            </div>
            <div class="sb-profile-info"><span class="sb-name">Asuum</span><span class="sb-status">Free Plan</span></div>
            <button class="sb-theme-toggle" id="sbThemeToggle" title="Toggle Sidebar Theme">
              <svg class="sb-theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <svg class="sb-theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
          </div>
        </div>
      </aside>

      <div class="main-area">
        <div class="header-area" id="headerArea">
          <div class="header-container" id="headerContainer">
            <button class="header-reopen-capsule" id="headerReopenBtn" title="Show Header">
              <span class="capsule-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
              <span class="capsule-label">Open</span>
            </button>
          </div>
        </div>

        <main class="main-panel" id="mainPanel">
          <div class="mm-wrap" id="mmWrap">
            <button class="mm-btn" id="mmBtn" title="Menu">
              <span class="mm-line"></span>
              <span class="mm-line"></span>
              <span class="mm-line"></span>
            </button>
            <div class="mm-menu" id="mmMenu">
              <button class="mm-item" data-action="new-chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/><line x1="12" y1="8.5" x2="12" y2="14.5"/><line x1="9" y1="11.5" x2="15" y2="11.5"/></svg><span>New Chat</span></button>
              <button class="mm-item" data-action="rename"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg><span>Rename Chat</span></button>
              <button class="mm-item" data-action="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>Export Chat</span></button>
              <div class="mm-divider"></div>
              <button class="mm-item" data-action="model-hub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></svg><span>Model Hub</span></button>
              <button class="mm-item highlight" data-action="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>Chat Rules</span><span class="mm-rules-dot" id="mmRulesDot"></span></button>
              <div class="mm-divider"></div>
              <button class="mm-item danger" data-action="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span>Delete Chat</span></button>
            </div>
          </div>

          <div class="chat-screen" id="chatScreen"><div class="chat-messages" id="chatMessages"></div></div>

          <button class="scroll-to-bottom-btn" id="scrollToBottomBtn" title="Scroll to latest">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>

          <div class="input-container">
            <textarea class="chat-input" rows="1" placeholder="Ask Asuum..."></textarea>
            <div class="input-actions">
              <button class="action-btn plus-btn" title="Add files">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <button class="action-btn send-btn" id="sendBtn" title="Send message">
                <svg class="send-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
          </div>
        </main>
      </div>

      <!-- ✅ CHAT RULES MODAL -->
      <div class="cr-overlay" id="crOverlay">
        <div class="cr-modal">
          <div class="cr-header">
            <div class="cr-title-group">
              <div class="cr-icon-wrap">
                <svg class="cr-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              </div>
              <div class="cr-title-text"><h2>Chat Rules</h2><p>Asuum will apply these rules to every response</p></div>
            </div>
            <button class="cr-close" id="crCloseBtn" title="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          </div>
          <div class="cr-body">
            <div class="cr-section"><span class="cr-section-label">Quick Rules</span><div class="cr-chips" id="crChips"></div></div>
            <div class="cr-section">
              <div class="cr-section-head"><span class="cr-section-label">Custom Rules</span><span class="cr-counter" id="crCounter">0 / 500</span></div>
              <textarea class="cr-textarea" id="crTextarea" maxlength="500" placeholder="Add your own custom rules..."></textarea>
            </div>
            <div class="cr-status" id="crStatus">No rules active</div>
          </div>
          <div class="cr-footer">
            <button class="cr-clear-btn" id="crClearBtn">Clear All</button>
            <button class="cr-save-btn" id="crSaveBtn">Save Rules</button>
          </div>
        </div>
      </div>

      <!-- ✅ MODEL HUB MODAL -->
      <div class="mh-overlay" id="mhOverlay">
        <div class="mh-modal" id="mhModal">
          <div class="mh-header">
            <div class="mh-title-group">
              <div class="mh-logo-icon-wrap">
                <svg class="mh-logo-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></svg>
              </div>
              <h2>Model Hub</h2>
            </div>
            <div class="mh-header-actions">
              <button class="mh-size-btn" id="mhSizeBtn" title="Fullscreen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
              <button class="mh-close-btn" id="mhCloseBtn" title="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
          </div>
          <div class="mh-categories" id="mhCategories"></div>
          <div class="mh-body"><div class="mh-providers-grid" id="mhProvidersGrid"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/app.ts"></script>
</body>
</html>
